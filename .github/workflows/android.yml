name: android

on:
  push:
    branches: [main, hestia/T67-probe]
  pull_request:
  # A run on demand makes a new APK when the last one has expired (see "CI artifacts" in the README).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The runner's SDK has its licences accepted, so the Android Gradle plugin fetches the platform it needs.
      - name: Test, lint and build
        env:
          CHECKS: >-
            :core:common:test :core:network:test :core:finance:test :core:today:test :core:documents:test
            :core:ui:lintDebug
            :feature:finance:testDebugUnitTest :feature:finance:lintDebug
            :feature:documents:testDebugUnitTest :feature:documents:lintDebug
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        shell: bash
        run: |
          set +e
          ./gradlew --console=plain --continue $CHECKS 2>&1 | tee gradle.log
          code=${PIPESTATUS[0]}
          grep -E '^e: ' gradle.log | head -10 | sed 's/^/::error::/'
          grep -E 'FAILED$' gradle.log | head -10 | sed 's/^/::error::/'
          for f in $(grep -lr '<failure' --include='*.xml' core/*/build/test-results feature/*/build/test-results app/build/test-results 2>/dev/null | head -10); do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              for fail in case.findall('failure'):
                  msg = (fail.get('message') or '').replace('\n', ' ')[:300]
                  print(f"::error::{case.get('classname')}.{case.get('name')}: {msg}")
          PY
          done
          grep -hE 'Error: |Warning: ' gradle.log | grep -i lint | head -5 | sed 's/^/::error::/'
          grep -E '^> |What went wrong' -A2 gradle.log | head -20 | sed 's/^/::notice::/'
          exit $code

      # Artifacts count against the account's storage quota. See "CI artifacts" in the README for the policy.
      # A failed upload (usually a full quota) does not fail the job: the next step writes a warning instead.
      - name: Upload the APK
        id: upload-apk
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: finance-insights-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Upload the screenshots
        id: upload-screenshots
        if: ${{ !cancelled() && (failure() || github.event_name == 'pull_request') }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            app/build/shots/
            feature/*/build/shots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the reports
        id: upload-reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/*/build/reports/
            feature/*/build/reports/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Warn about failed uploads
        if: >-
          ${{ !cancelled() && (steps.upload-apk.outcome == 'failure' ||
          steps.upload-screenshots.outcome == 'failure' || steps.upload-reports.outcome == 'failure') }}
        shell: bash
        env:
          APK: ${{ steps.upload-apk.outcome }}
          SCREENSHOTS: ${{ steps.upload-screenshots.outcome }}
          REPORTS: ${{ steps.upload-reports.outcome }}
        run: |
          for item in "APK:$APK" "screenshots:$SCREENSHOTS" "reports:$REPORTS"; do
            if [ "${item#*:}" = failure ]; then
              echo "::warning title=Artifact upload failed::The upload of the ${item%%:*} failed. The usual cause is a full artifact storage quota. Delete old artifacts (README, CI artifacts)."
            fi
          done
