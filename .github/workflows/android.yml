name: android

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The runner's SDK has its licences accepted, so the Android Gradle plugin fetches the platform it needs.
      - name: Test, lint and build
        env:
          CHECKS: >-
            :core:common:test :core:network:test :core:finance:test
            :core:ui:lintDebug
            :feature:finance:testDebugUnitTest :feature:finance:lintDebug
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        run: ./gradlew --console=plain $CHECKS

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: finance-insights-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            app/build/shots/
            feature/*/build/shots/
          if-no-files-found: ignore

      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/*/build/reports/
            feature/*/build/reports/
            app/build/reports/
