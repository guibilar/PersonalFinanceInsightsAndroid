name: android

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The runner's SDK has its licences accepted, so the Android Gradle plugin fetches the platform it needs.
      - name: Test, lint and build
        env:
          CHECKS: >-
            :core:common:test :core:network:test :core:finance:test
            :core:ui:lintDebug
            :feature:finance:testDebugUnitTest :feature:finance:lintDebug
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        run: |
          set -o pipefail
          ./gradlew --console=plain --continue --no-build-cache $CHECKS 2>&1 | tee build.log

      # TEMPORARY (T05): reports results as annotations, as the session can't read logs or artifacts. Removed before merge.
      - name: Report (temporary)
        if: always()
        run: |
          enc() { python3 -c 'import sys;d=sys.stdin.read();print(d.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'; }
          echo "::notice title=shots::$(find . -path '*/build/shots/*.png' -printf '%f ' -exec sh -c 'sha256sum "$1" | cut -c1-16' _ {} \; | sort | enc)"
          echo "::notice title=summary::$(grep -E 'tests completed|BUILD (SUCCESSFUL|FAILED)|actionable tasks' build.log | enc)"
          grep -nE '^e: |^w: .*(warning|deprecat)|FAILED$|What went wrong|^> [^T]|Error: |Exception|expected|Lint found' build.log | head -150 > problems.txt || true
          if [ -s problems.txt ]; then echo "::error title=problems::$(enc < problems.txt)"; fi
          for f in $(find . -path '*/build/reports/lint-results-*.txt'); do echo "::warning title=lint $f::$(head -c 20000 $f | enc)"; done

      - name: Upload the APK
        uses: actions/upload-artifact@v6
        with:
          name: finance-insights-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: |
            app/build/shots/
            feature/*/build/shots/
          if-no-files-found: ignore

      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            core/*/build/reports/
            feature/*/build/reports/
            app/build/reports/
