name: android

on:
  push:
    branches: [main]
  pull_request:
  # A run on demand makes a new APK when the last one has expired (see "CI artifacts" in the README).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The runner's SDK has its licences accepted, so the Android Gradle plugin fetches the platform it needs.
      # PROBE (T29): compare the screenshots of this branch with main. Not for review.
      - name: Compare screenshots with main
        shell: bash
        run: |
          set -euo pipefail
          tests() { ./gradlew --console=plain --no-build-cache :feature:finance:testDebugUnitTest --rerun :app:testDebugUnitTest --rerun; }
          tests
          git fetch --no-tags --depth=1 origin main
          git worktree add ../base FETCH_HEAD
          (cd ../base && tests)
          pip install --quiet pillow
          python3 - <<'PY'
          import hashlib, pathlib
          from PIL import Image, ImageChops
          def shots(root):
              r = pathlib.Path(root)
              return {str(p.relative_to(r)): p for p in r.glob('*/build/shots/**/*.png')} | \
                     {str(p.relative_to(r)): p for p in r.glob('*/*/build/shots/**/*.png')}
          a, b = shots('../base'), shots('.')
          only_a, only_b = sorted(set(a) - set(b)), sorted(set(b) - set(a))
          diffs = []
          for k in sorted(set(a) & set(b)):
              if a[k].read_bytes() == b[k].read_bytes():
                  continue
              x, y = Image.open(a[k]).convert('RGBA'), Image.open(b[k]).convert('RGBA')
              if x.size != y.size:
                  diffs.append(f'{k}: size {x.size} vs {y.size}')
                  continue
              d = ImageChops.difference(x, y)
              n = sum(1 for px in d.getdata() if max(px) > 0)
              diffs.append(f'{k}: {n} pixels differ, max {max(max(px) for px in d.getdata())}')
          print(f'::notice::Shots: main {len(a)}, branch {len(b)}, same {len(set(a) & set(b)) - len(diffs)}, differ {len(diffs)}, only main {only_a}, only branch {only_b}')
          if diffs:
              print('::notice::' + ' | '.join(diffs))
          PY
