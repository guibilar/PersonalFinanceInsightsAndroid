name: android

on:
  push:
    branches: [main, hestia/T84-probe]
  pull_request:
  # A run on demand makes a new APK when the last one has expired (see "CI artifacts" in the README).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The runner's SDK has its licences accepted, so the Android Gradle plugin fetches the platform it needs.
      - name: Test, lint and build
        env:
          CHECKS: >-
            :core:common:test :core:network:test :core:finance:test :core:today:test :core:documents:test :core:tasks:test
            :core:ui:lintDebug
            :feature:finance:testDebugUnitTest :feature:finance:lintDebug
            :feature:documents:testDebugUnitTest :feature:documents:lintDebug
            :feature:tasks:testDebugUnitTest :feature:tasks:lintDebug
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        # --continue runs the tests of all modules after a failure, so the annotations below list all failed tests.
        shell: bash
        run: ./gradlew --console=plain --continue $CHECKS 2>&1 | tee gradle.log

      - name: Probe errors (temporary)
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 scripts/probe-errors.py

      # Task sessions cannot read the logs. These steps write the results as annotations (see "CI annotations").
      - name: Test results as annotations
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 scripts/test-annotations.py

      - name: Push small copies of the images (temporary probe)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p probe-shots
          for f in feature/tasks/build/shots/*.png feature/documents/build/shots/document-tasks.png app/build/shots/capture.png app/build/shots/modules.png app/build/shots/settings-notifications.png app/build/shots/today.png; do
            [ -f "$f" ] || continue
            convert "$f" -resize 40% -quality 60 "probe-shots/$(basename "$f" .png).jpg"
          done
          git config user.name "probe"
          git config user.email "probe@example.com"
          git add probe-shots
          git commit -m "Probe images" || true
          git push origin HEAD:hestia/T84-probe || true

      # The list of screenshot hashes of main is in the Actions cache. A pull request compares its images with it.
      - name: Restore the screenshot list of main
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: screenshot-list/
          key: screenshots-${{ github.event.pull_request.base.sha }}
          restore-keys: screenshots-

      - name: Screenshot summary as an annotation
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OUTPUT: ${{ github.event_name == 'pull_request' && 'screenshots-head.txt' || 'screenshot-list/screenshots.txt' }}
        run: |
          mkdir -p screenshot-list
          # On main the new list is written where the cache saves it; only a pull request compares with a base list.
          python3 scripts/screenshot-summary.py "$OUTPUT" ${{ github.event_name == 'pull_request' && 'screenshot-list/screenshots.txt' || '' }}

      - name: Save the screenshot list of main
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: screenshot-list/
          key: screenshots-${{ github.sha }}

      # Artifacts count against the account's storage quota. See "CI artifacts" in the README for the policy.
      # A failed upload (usually a full quota) does not fail the job: the next step writes a warning instead.
      - name: Upload the APK
        id: upload-apk
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: finance-insights-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Upload the screenshots
        id: upload-screenshots
        if: ${{ !cancelled() && (failure() || github.event_name == 'pull_request') }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            app/build/shots/
            feature/*/build/shots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the reports
        id: upload-reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/*/build/reports/
            feature/*/build/reports/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Warn about failed uploads
        if: >-
          ${{ !cancelled() && (steps.upload-apk.outcome == 'failure' ||
          steps.upload-screenshots.outcome == 'failure' || steps.upload-reports.outcome == 'failure') }}
        shell: bash
        env:
          APK: ${{ steps.upload-apk.outcome }}
          SCREENSHOTS: ${{ steps.upload-screenshots.outcome }}
          REPORTS: ${{ steps.upload-reports.outcome }}
        run: |
          for item in "APK:$APK" "screenshots:$SCREENSHOTS" "reports:$REPORTS"; do
            if [ "${item#*:}" = failure ]; then
              echo "::warning title=Artifact upload failed::The upload of the ${item%%:*} failed. The usual cause is a full artifact storage quota. Delete old artifacts (README, CI artifacts)."
            fi
          done
