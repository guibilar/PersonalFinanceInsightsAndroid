name: android

on:
  push:
    branches: [main]
  pull_request:
  # A run on demand makes a new APK when the last one has expired (see "CI artifacts" in the README).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The runner's SDK has its licences accepted, so the Android Gradle plugin fetches the platform it needs.
      - name: Test, lint and build
        env:
          CHECKS: >-
            :core:common:test :core:network:test :core:finance:test :core:today:test :core:documents:test :core:tasks:test :core:home:test :core:people:test :core:journal:test
            :core:ui:lintDebug
            :feature:finance:testDebugUnitTest :feature:finance:lintDebug
            :feature:documents:testDebugUnitTest :feature:documents:lintDebug
            :feature:tasks:testDebugUnitTest :feature:tasks:lintDebug
            :feature:home:testDebugUnitTest :feature:home:lintDebug
            :feature:people:testDebugUnitTest :feature:people:lintDebug
            :feature:journal:testDebugUnitTest :feature:journal:lintDebug
            :feature:timeline:testDebugUnitTest :feature:timeline:lintDebug
            :feature:search:testDebugUnitTest :feature:search:lintDebug
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        # --continue runs the tests of all modules after a failure, so the annotations below list all failed tests.
        # The output is also kept in a file for the compile error annotations (T28).
        shell: bash
        run: ./gradlew --console=plain --continue $CHECKS 2>&1 | tee gradle-output.log; exit "${PIPESTATUS[0]}"

      - name: Compile errors as annotations
        if: failure()
        shell: bash
        run: python3 scripts/gradle-annotations.py gradle-output.log

      # Task sessions cannot read the logs. These steps write the results as annotations (see "CI annotations").
      - name: Test results as annotations
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 scripts/test-annotations.py

      # T28: each image must be the same as its recorded copy in <module>/screenshots (README, Screenshots).
      - name: Screenshots match the recorded images
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 scripts/screenshots.py check

      # Artifacts count against the account's storage quota. See "CI artifacts" in the README for the policy.
      # A failed upload (usually a full quota) does not fail the job: the next step writes a warning instead.
      - name: Upload the APK
        id: upload-apk
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: finance-insights-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Upload the screenshots
        id: upload-screenshots
        # The recorded images are in git (T28), so only a failed run uploads the new ones.
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            app/build/shots/
            feature/*/build/shots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the reports
        id: upload-reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/*/build/reports/
            feature/*/build/reports/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Warn about failed uploads
        if: >-
          ${{ !cancelled() && (steps.upload-apk.outcome == 'failure' ||
          steps.upload-screenshots.outcome == 'failure' || steps.upload-reports.outcome == 'failure') }}
        shell: bash
        env:
          APK: ${{ steps.upload-apk.outcome }}
          SCREENSHOTS: ${{ steps.upload-screenshots.outcome }}
          REPORTS: ${{ steps.upload-reports.outcome }}
        run: |
          for item in "APK:$APK" "screenshots:$SCREENSHOTS" "reports:$REPORTS"; do
            if [ "${item#*:}" = failure ]; then
              echo "::warning title=Artifact upload failed::The upload of the ${item%%:*} failed. The usual cause is a full artifact storage quota. Delete old artifacts (README, CI artifacts)."
            fi
          done
